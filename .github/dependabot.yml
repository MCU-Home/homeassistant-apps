#
# Every action in .github/workflows is pinned to a full commit SHA; this
# is what keeps those pins current.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The root pyproject.toml holds only the lint tool pins ([dependency-
  # groups] dev), no project of its own — its own entry so those pins
  # get bumped too.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
