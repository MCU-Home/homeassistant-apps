#
# TOOL CONFIGURATION ONLY — this repository publishes no distribution
# (it carries app metadata for the Home Assistant Supervisor, README
# "What this repository holds"). This file holds ruff's settings for
# scripts/check_apps.py and the tools that check_apps.py and the lint
# gate need, as a PEP 735 dependency group ([dependency-groups] dev,
# installed with `pip install --group dev`) rather than a
# requirements.txt: a group installs standalone, the same convention as
# every other MCUHome repository.

[dependency-groups]
dev = [
  "pyyaml==6.0.3",
  "ruff==0.16.1",
  "codespell==2.4.3",
  "reuse==5.0.2",
  "pre-commit-hooks==5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The ignored words are deliberate spellings, not slips: Requestor and
# PASE are the Matter specification's own, OT is OpenThread, rsource is
# Kconfig's. Generated documents and patches are skipped because their
# wording is not ours to correct. Moved here from the CI command line so
# scripts/lint.d/codespell can run the plain tool.
[tool.codespell]
ignore-words-list = "requestor,pase,ot,rsource,re-declared,re-declare,re-used,unparseable,pre-empt"
skip = "./.git,./frontend/node_modules,*.matter,*.zap,pnpm-lock.yaml,*.patch"
