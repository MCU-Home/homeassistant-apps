#
# TOOL CONFIGURATION ONLY — this repository publishes no distribution
# (it carries app metadata for the Home Assistant Supervisor, README
# "What this repository holds"). This file exists so `ruff` has
# somewhere to read its settings from for `scripts/check_apps.py`, the
# same convention as every other MCUHome repository's pyproject.toml.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
